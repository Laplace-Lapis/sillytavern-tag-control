<div id="tag-control-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="Extensions Tag-based Management">Extensions Tag-based Management</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="tag-control-enabled">
                <input id="tag-control-enabled" type="checkbox">
                <span data-i18n="Enable Tag-based Management">Enable Tag-based Management</span>
            </label>

            <div class="tag-control-section">
                <div class="tag-control-section-header">
                    <span data-i18n="Rules">Rules</span>
                </div>
                <div id="tag-control-rules-list"></div>
                <div class="tag-control-add-row">
                    <button id="tag-control-add-rule" class="menu_button menu_button_icon interactable" title="Add new rule" tabindex="0">
                        <i class="fa-solid fa-plus"></i>
                        <span data-i18n="Add Rule">Add Rule</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
