<div class="tag-control-rule" data-id="{{id}}">
    <span class="drag-handle menu-handle">&#9776;</span>
    <span class="tag-control-rule-name">{{name}}</span>
    <span class="tag-control-rule-ext">{{extName}}</span>
    <button class="tag-control-edit-rule menu_button menu_button_icon interactable" data-i18n="[title]Edit rule" title="Edit rule" tabindex="0">
        <i class="fa-solid fa-pen-to-square"></i>
    </button>
    <button class="tag-control-delete-rule menu_button menu_button_icon interactable" data-i18n="[title]Delete rule" title="Delete rule" tabindex="0">
        <i class="fa-solid fa-trash-can"></i>
    </button>
</div>
